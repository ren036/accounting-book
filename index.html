<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>记账本</title>
    <script>
      try {
        const scheme = localStorage.getItem('accounting-book-color-scheme') === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.mantineColorScheme = scheme
        document.documentElement.style.colorScheme = scheme
        document.querySelector('meta[name="theme-color"]').content = scheme === 'dark' ? '#12151a' : '#f5f6f8'
      } catch (error) {
        document.documentElement.dataset.mantineColorScheme = 'light'
      }
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      html,
      body {
        background: #f5f6f8;
      }

      html[data-mantine-color-scheme='dark'],
      html[data-mantine-color-scheme='dark'] body {
        background: #12151a;
      }

      .app-boot {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        color: #1f2429;
        font-family: "Noto Sans SC", "Microsoft YaHei", ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      .app-boot__mark {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border-radius: 18px;
        background: #111827;
        color: white;
        font-size: 27px;
        font-weight: 800;
        box-shadow: 0 10px 28px rgb(17 24 39 / 18%);
      }

      .app-boot__title {
        font-size: 17px;
        font-weight: 750;
        letter-spacing: 0.08em;
      }

      html[data-mantine-color-scheme='dark'] .app-boot {
        color: #e8ebf0;
      }

      /* 深色模式下把开屏 logo 反转为浅底深字，否则墨黑在深色背景上不可见 */
      html[data-mantine-color-scheme='dark'] .app-boot__mark {
        background: #cbd5e1;
        color: #111827;
        box-shadow: 0 10px 28px rgb(0 0 0 / 32%);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot" role="status" aria-label="记账本正在启动">
        <div class="app-boot__mark" aria-hidden="true">账</div>
        <div class="app-boot__title">记账本</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
